[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "disto"
version = "0.1.0"
description = "DISTO: a learned evaluation metric for multiple-choice question distractors"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.8"
authors = [{ name = "Bilal Ghanem" }]
dependencies = ["torch>=1.12", "transformers>=4.30"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
disto = "disto.__main__:main"

[tool.setuptools]
packages = ["disto"]
